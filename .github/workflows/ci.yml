name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: Prebuild Validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Prebuild Validation (compileall)
        shell: bash
        run: |
          echo "Running Python bytecode compilation..."

          python -m compileall . -q

  markdownlint:
    runs-on: ubuntu-latest
    needs: prebuild

    steps:
      - uses: actions/checkout@v5
      - uses: DavidAnson/markdownlint-cli2-action@v23

  lint-interrogate:
    name: Lint with Interrogate
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install Interrogate
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install interrogate

      - name: Run Lint
        shell: bash
        run: |
          echo "Running Interrogate..."
          interrogate -vvc pyproject.toml

  lint-ruff:
    name: Lint and Format with Ruff
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install Ruff
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint
        shell: bash
        run: |
          echo "Running Ruff static analysis..."

          ruff check .

      - name: Run Ruff Format Check
        shell: bash
        run: |
          echo "Checking formatting with Ruff..."

          ruff format . --check

  lint-flake8:
    name: Lint with Flake8
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install Flake8
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Lint
        shell: bash
        run: |
          echo "Running Flake8 static analysis..."

          flake8 .

  lint-bandit:
    name: Security Scan with Bandit
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install Bandit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis
        shell: bash
        run: |
          echo "Running Bandit security analysis..."

          bandit -r . -q

  lint-mypy:
    name: Type Check with MyPy
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install MyPy
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install mypy

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run MyPy Type Checking
        shell: bash
        run: |
          echo "Running MyPy type checking..."

          mypy . \
            --check-untyped-defs \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --disallow-untyped-decorators \
            --disallow-untyped-calls \
            --disallow-subclassing-any \
            --warn-unused-ignores \
            --warn-unused-configs \
            --warn-redundant-casts \
            --warn-return-any \
            --warn-unreachable

  lint-pyright:
    name: Lint with Pyright
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Pyright
        shell: bash
        run: |
          pip install pyright

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Pyright Type Checking
        shell: bash
        run: |
          echo "Running Pyright type checking..."

          pyright --verbose

  lint-darglint:
    name: Docstring Validation with Darglint
    needs: prebuild
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Darglint
        run: |
          python -m pip install --upgrade pip
          pip install darglint

      - name: Run Darglint
        run: |
          darglint .

  lint-ty:
    name: Type Checking with Ty
    needs: prebuild
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ty
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ty

      - name: Run Ty Type Checking
        run: |
          ty check .

  lint-clang-format:
    name: Format Check with clang-format
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install clang-format
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format Check
        shell: bash
        run: |
          echo "Checking C formatting with clang-format..."

          find engine/c -type f \( -name "*.c" -o -name "*.h" \) -not -path "engine/c/build/*" -print0 \
            | xargs -0 clang-format --style=file:.clang-format --dry-run --Werror --verbose

  lint-cppcheck:
    name: Static Analysis with cppcheck
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cppcheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        shell: bash
        run: |
          echo "Running cppcheck static analysis..."

          cppcheck --project=.cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1

  lint-shellcheck:
    name: Lint Shell Scripts with ShellCheck
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0

  lint-typos:
    name: Spell Check with Typos
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Typos
        uses: crate-ci/typos@v1.50.2
        with:
          config: typos.toml

  lint-actionlint:
    name: Lint Workflows with Actionlint
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Actionlint
        shell: bash
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run Actionlint
        shell: bash
        run: |
          echo "Linting GitHub Actions workflows..."

          ./actionlint -color -config-file .github/actionlint.yaml -verbose

  pip-audit:
    name: Dependency Audit with pip-audit
    needs: prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: "pip"

      - name: Install pip-audit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run pip-audit Dependency Audit
        shell: bash
        run: |
          echo "Running pip-audit dependency audit..."

          pip-audit -r requirements.txt

  build:
    name: Final Build Validation
    needs:
      - lint-ruff
      - lint-interrogate
      - lint-flake8
      - lint-bandit
      - lint-mypy
      - lint-pyright
      - pip-audit
      - lint-darglint
      - markdownlint
      - lint-ty
      - lint-clang-format
      - lint-actionlint
      - lint-typos
      - lint-cppcheck
      - lint-shellcheck

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Final CI Status
        shell: bash
        run: |
          echo "========================================"
          echo "All CI checks passed successfully."
          echo "ABS Engine CI pipeline is healthy."
          echo "========================================"
